model:
  vocab_size: 2000
  block_size: 256         # Scale up (from 128)
  n_layer: 6              # Scale up (from 4)
  n_head: 8               # Scale up (from 4)
  n_embd: 256             # Scale up (from 128)
  dropout: 0.1
  bias: false

training:
  batch_size: 16          # Keep batch_size at 16 (better for CPU)
  learning_rate: 1.0e-3
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  epochs: 10              # 10 epochs is a good balance
  warmup_iters: 20
  lr_decay_iters: 300
  min_lr: 1.0e-4
  eval_interval: 20       
  eval_iters: 10
  log_interval: 5
  checkpoint_dir: "experiments/checkpoints"
  device: "cuda"          # <--- Changed to cuda for NVIDIA GPUs
  seed: 1337
